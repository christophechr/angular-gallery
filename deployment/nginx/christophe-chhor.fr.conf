# Include this file in the http context of the existing host Nginx.
server {
    listen 80;
    server_name christophe-chhor.fr www.christophe-chhor.fr;
    return 301 https://christophe-chhor.fr$request_uri;
}

server {
    listen 443 ssl;
    server_name christophe-chhor.fr www.christophe-chhor.fr;

    ssl_certificate /etc/nginx/ssl/christophe-chhor.fr/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/christophe-chhor.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        # Must match the GitHub environment variable APP_PORT.
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
